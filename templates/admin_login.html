<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JMD Admin Login</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body class="admin-body"><main class="admin-shell"><a class="brand" href="{{ url_for('home') }}"><span class="brand-mark">JMD</span><span class="brand-name">AUDIO & LIGHTINGS</span></a><form class="panel admin-login" method="post"><h1>Admin login</h1><p class="muted">Sign in to manage gallery uploads and customer reviews.</p><input type="hidden" name="action" value="login"><label>Admin password<input type="password" name="password" required autocomplete="current-password"></label><button class="btn btn-primary" type="submit">Sign in ↗</button><a class="text-link" href="{{ url_for('home') }}">← Back to website</a></form>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}</main></body></html>
